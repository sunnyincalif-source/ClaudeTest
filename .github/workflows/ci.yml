name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: cd packages/engine && uv sync --frozen
      - name: Lint (TS + Python)
        run: pnpm lint
      - name: Build
        run: pnpm build
      - name: Test (Vitest + pytest)
        run: pnpm test
