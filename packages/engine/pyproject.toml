[project]
name = "leettrace"
version = "0.1.0"
description = "Local trace engine for LeetCode practice: real CPython tracing, a loopback server, a CLI, and a TUI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "LeetTrace contributors" }]
keywords = ["leetcode", "visualizer", "debugger", "trace", "education"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Topic :: Software Development :: Debuggers",
  "Topic :: Education",
]
dependencies = [
  "pydantic>=2.9,<3",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "websockets>=13",
  "watchfiles>=0.24",
  "typer>=0.12",
  "textual>=0.80",
  "httpx>=0.27,<1",
]

[project.scripts]
leettrace = "leettrace.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "pyinstaller>=6.10"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leettrace"]
# web_dist is gitignored but must ship in the wheel (built by apps/web).
artifacts = ["src/leettrace/web_dist/**"]

[tool.hatch.build.targets.sdist]
artifacts = ["src/leettrace/web_dist/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient", "ignore:Using `httpx`:DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = [
  "S101",  # asserts are fine in tests
  "S102",  # exec is the product: we run the user's own code, sandboxed in a subprocess
  "S307",  # eval is used only on AST-whitelisted pure expressions (narration)
  "S603",  # subprocess with our own argv
  "S110",  # best-effort narration probes intentionally swallow failures
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/leettrace"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["watchfiles.*"]
ignore_missing_imports = true
